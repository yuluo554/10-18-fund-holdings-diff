name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        python-version: ["3.8", "3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Selftest (module form)
        run: python -m funddiff selftest

      - name: Selftest (console script form)
        run: funddiff selftest

      - name: CLI smoke matrix
        run: python tools/ci_smoke.py

      - name: Verify console script entry point
        run: |
          funddiff --version
          python -m funddiff --version
